# Example workflow: log in to Azure with OIDC (no secrets) and deploy a Bicep template.
# Copy to .github/workflows/ in the target repository and adjust the inputs.
# Requires a federated credential whose subject matches this trigger
# (see templates/bicep/github-oidc-identity.bicep).

name: deploy-azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file templates/bicep/data-factory.bicep \
            --parameters baseName="${{ vars.BASE_NAME }}"

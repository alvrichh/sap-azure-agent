# Publishes GitHub Releases from CHANGELOG.md.
# - Tag push vX.Y.Z: creates (or updates) that release.
# - Push to main: creates a release for every vX.Y.Z tag that doesn't have one yet (backfill; existing releases untouched).
# - Manual run: creates or updates the release of the given existing tag.
# Notes come from the version's section in the changelog on main. Versions below 1.0.0 are pre-releases
# (not yet validated end to end against real systems).
name: release

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.7.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check the changelog
        run: python3 scripts/check_changelog.py

      - name: Publish releases
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tags="${{ inputs.tag }}"; update=true
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tags="${{ github.ref_name }}"; update=true
          else
            tags=$(git tag --list 'v*.*.*' --sort=version:refname); update=false
          fi
          for tag in $tags; do
            exists=false
            gh release view "$tag" >/dev/null 2>&1 && exists=true
            if $exists && ! $update; then
              echo "skip $tag (release exists)"
              continue
            fi
            python3 scripts/release_notes.py "$tag" > notes.md
            prerelease=""
            [[ "$tag" == v0.* ]] && prerelease="--prerelease"
            if $exists; then
              gh release edit "$tag" --title "$tag" --notes-file notes.md $prerelease
              echo "updated $tag"
            else
              gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag $prerelease
              echo "created $tag"
            fi
          done
